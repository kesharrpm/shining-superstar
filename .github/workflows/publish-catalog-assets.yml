name: Publish catalog assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev/2.0.0/**'
      - 'qa/themeData.json'
      - 'cloudflare-catalog/scripts/publish_catalog_assets.py'
      - '.github/workflows/publish-catalog-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Prepare catalog-assets worktree
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if git ls-remote --exit-code --heads origin catalog-assets >/dev/null 2>&1; then
            git fetch origin catalog-assets:catalog-assets
            git worktree add ../publish catalog-assets
          else
            git worktree add --detach ../publish
            cd ../publish
            git checkout --orphan catalog-assets
            git rm -rf . || true
          fi

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check pyzipper

      - name: Build processed catalog
        env:
          SHINING_BUNDLE_PASSWORD: ${{ secrets.SHINING_BUNDLE_PASSWORD }}
        run: |
          test -n "$SHINING_BUNDLE_PASSWORD" || (echo 'Missing repository secret SHINING_BUNDLE_PASSWORD' && exit 1)
          python source/cloudflare-catalog/scripts/publish_catalog_assets.py \
            --source source \
            --publish publish \
            --password "$SHINING_BUNDLE_PASSWORD"

      - name: Publish catalog-assets branch
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No catalog asset changes.'
            exit 0
          fi
          git commit -m 'Publish processed catalog assets'
          git push origin HEAD:catalog-assets
